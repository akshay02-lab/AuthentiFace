<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Secure Login - AuthentiFace</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, #4f46e5, #020617);
      color: #f9fafb;
    }

    .card {
      background: rgba(15, 23, 42, 0.85);
      border-radius: 18px;
      padding: 32px 36px;
      width: 360px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      border: 1px solid rgba(148, 163, 184, 0.35);
      backdrop-filter: blur(18px);
    }

    h1 {
      font-size: 1.7rem;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.35rem;
      color: #e5e7eb;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: rgba(15, 23, 42, 0.7);
      color: #f9fafb;
      outline: none;
      font-size: 0.9rem;
    }

    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 1px #6366f1;
    }

    .field {
      margin-bottom: 1rem;
    }

    button {
      width: 100%;
      padding: 10px 14px;
      border-radius: 999px;
      border: none;
      margin-top: 0.5rem;
      background: linear-gradient(135deg, #6366f1, #22c55e);
      color: #f9fafb;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.1s ease;
      box-shadow: 0 10px 30px rgba(79, 70, 229, 0.55);
    }

    button:hover {
      filter: brightness(1.08);
      box-shadow: 0 14px 40px rgba(79, 70, 229, 0.7);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.55);
    }

    .footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #6b7280;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.2);
      color: #6ee7b7;
      margin-bottom: 0.75rem;
    }

    .error-box {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.55);
      color: #fecaca;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      🔒 Face Liveness Protected
    </div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue to your secure dashboard.</p>

    {% if error %}
    <div class="error-box">
      {{ error }}
    </div>
    {% endif %}

    <form action="/login" method="POST">

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required placeholder="you@example.com" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required placeholder="••••••••" />
      </div>

      <button type="submit">Continue</button>
    </form>

    <div class="footer">
      This login is protected by <strong>micro-expression liveness detection</strong>.
    </div>
  </div>
</body>
</html>
